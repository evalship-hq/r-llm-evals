name: Evals
on:
  pull_request:
  push:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # the bot and tinyeval's judge both use it
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv # the version in renv.lock
          use-public-rspm: true # binary packages, so the install takes seconds
      - uses: r-lib/actions/setup-renv@v2 # installs renv.lock's packages and caches them
      # R has no build step: load the bot once, so a missing package fails here.
      - run: Rscript -e 'source("R/support.R")'
      - run: Rscript -e 'quit(status = tinyeval::run("-n", "3"))'
        if: env.ANTHROPIC_API_KEY != ''
      - run: echo "::notice::Add the ANTHROPIC_API_KEY repository secret to run the evals."
        if: env.ANTHROPIC_API_KEY == ''
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: eval-results.json
